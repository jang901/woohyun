<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>20점 볼링</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column. Scoreboards sit above a perspective lane canvas, status line below.
   Look: retro alley at night, teal surround, maple lane, one red ball. Committed single theme. */
:root {
  --ink: #0e2c30;
  --surface: #16424a;
  --surface-2: #1d525b;
  --line: #2f6770;
  --cream: #f7f0dc;
  --muted: #a3c4c2;
  --maple: #d9a45b;
  --ball: #d6181f;
  --amber: #f5b83c;
  --mint: #62d3bf;
  --font-display: "Black Han Sans", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--ink);
  background-image: radial-gradient(circle at 15% 0%, rgba(98, 211, 191, 0.10), transparent 45%),
                    radial-gradient(circle at 90% 100%, rgba(245, 184, 60, 0.07), transparent 40%);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { min-width: 0; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.1; letter-spacing: 0.01em; }
.tag { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.pill {
  flex: none; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--cream);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 99px; padding: 7px 14px; cursor: pointer;
}
.pill:hover { background: var(--surface-2); }
.pill[aria-pressed="true"] { color: var(--muted); }
button:focus-visible, canvas:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card {
  min-width: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px;
  transition: background-color .25s, border-color .25s;
}
.card.active { background: var(--surface-2); border-color: var(--p-color); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-height: 22px; }
.name { font-weight: 700; font-size: 14px; color: var(--p-color); }
.turn-badge {
  font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px;
  background: var(--p-color); color: var(--ink); visibility: hidden; white-space: nowrap;
}
.card.active .turn-badge { visibility: visible; }
.mid { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.score {
  font-family: var(--font-display); font-size: 50px; line-height: 1; display: flex; align-items: baseline; gap: 4px;
  font-variant-numeric: tabular-nums;
}
.score small { font-family: var(--font-body); font-size: 14px; color: var(--muted); font-weight: 500; }
.deck { display: flex; flex-direction: column; gap: 3px; align-items: center; flex: none; }
.prow { display: flex; gap: 3px; justify-content: center; }
.pin { width: 11px; height: 11px; border-radius: 50%; background: var(--cream); transition: background-color .3s, box-shadow .3s; }
.pin.down { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.meter { height: 8px; border-radius: 99px; background: var(--ink); overflow: hidden; }
.meter > i { display: block; height: 100%; width: 0; background: var(--p-color); transition: width .5s; }
.throws { display: flex; gap: 5px; flex-wrap: wrap; min-height: 24px; align-items: center; }
.chip {
  font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 6px;
  background: var(--ink); color: var(--cream);
}
.empty { font-size: 12px; color: var(--muted); }

.stage { position: relative; border-radius: 16px; overflow: hidden; border: 1.5px solid var(--line); background: var(--ink); line-height: 0; }
canvas { width: 100%; height: auto; aspect-ratio: 560 / 680; display: block; cursor: pointer; touch-action: manipulation; }
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 24px; text-align: center; line-height: 1.35; background: rgba(8, 28, 32, 0.80);
}
.kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: var(--amber); }
.overlay h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(36px, 10vw, 56px); text-wrap: balance; }
.overlay p { margin: 0; color: var(--muted); font-size: 15px; }
.overlay .final { color: var(--cream); font-weight: 700; font-variant-numeric: tabular-nums; }
.overlay button {
  margin-top: 10px; font-family: var(--font-display); font-size: 20px; padding: 11px 30px; border-radius: 99px;
  border: 0; background: var(--ball); color: #fff; cursor: pointer;
}
.overlay button:hover { filter: brightness(1.12); }

.status { margin: 0; min-height: 1.6em; text-align: center; font-weight: 500; }
.help { margin: 0; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>20점 볼링</h1>
      <p class="tag">먼저 20점을 넘기는 사람이 이깁니다</p>
    </div>
    <button id="soundBtn" class="pill" type="button" aria-pressed="false">소리 켜짐</button>
  </header>

  <section class="scores" id="scores" aria-label="점수판"></section>

  <div class="stage">
    <canvas id="lane" width="560" height="680" tabindex="0" aria-label="볼링 레인. 빨간 공의 정중앙을 클릭하면 공이 굴러갑니다. 키보드는 Enter 또는 스페이스바."></canvas>
    <div class="overlay" id="overlay" role="dialog" aria-labelledby="winTitle" hidden>
      <span class="kicker">경기 종료</span>
      <h2 id="winTitle"></h2>
      <p id="winSub"></p>
      <p class="final" id="winFinal"></p>
      <button id="again" type="button">다시 하기</button>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>
  <p class="help">공의 정중앙을 클릭할수록 핀이 많이 쓰러집니다. 중심에서 멀어질수록 쓰러지는 핀이 줄고, 너무 벗어나면 거터로 빠집니다.</p>
</div>

<script>
(function () {
  'use strict';

  /* ---------- constants & projection ---------- */
  var W = 560, H = 680, CX = 280, W0 = 200, K = 1.25, Y0 = 600, Y1 = 150;
  var PA = (Y0 - Y1) / (1 - 1 / (1 + K)), YH = Y0 - PA;
  function sc(z) { return 1 / (1 + K * z); }
  function sy(z) { return YH + PA * sc(z); }
  function sx(x, z) { return CX + x * W0 * sc(z); }
  var BALL_R = 46;
  function bcy(z) { return sy(z) - BALL_R * sc(z) * 0.9; }
  var BALL_CY0 = bcy(0);
  var ROW_Z0 = 0.84, ROW_DZ = 0.045, PIN_DX = 0.578;
  var VZ = ROW_Z0 / 1.1;
  var TARGET = 20;
  var NAMES = ['플레이어 1', '플레이어 2'];
  var COLORS = ['#f5b83c', '#62d3bf'];
  var RED = '#d6181f';
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  var PIN_LAYOUT = [];
  (function () {
    var num = 1;
    for (var r = 0; r < 4; r++) {
      for (var i = 0; i <= r; i++) {
        PIN_LAYOUT.push({ num: num++, x: (i - r / 2) * PIN_DX, z: ROW_Z0 + r * ROW_DZ, row: r });
      }
    }
  })();

  /* ---------- DOM ---------- */
  var canvas = document.getElementById('lane');
  var ctx = canvas.getContext('2d');
  canvas.width = W * DPR; canvas.height = H * DPR;
  var scoresEl = document.getElementById('scores');
  var statusEl = document.getElementById('status');
  var overlay = document.getElementById('overlay');
  var soundBtn = document.getElementById('soundBtn');

  var DECK_ROWS = [[7, 8, 9, 10], [4, 5, 6], [2, 3], [1]];
  function cardHTML(p) {
    var rows = DECK_ROWS.map(function (row) {
      return '<div class="prow">' + row.map(function (n) { return '<span class="pin" data-n="' + n + '"></span>'; }).join('') + '</div>';
    }).join('');
    return '<article class="card" id="card' + p + '" style="--p-color:' + COLORS[p] + '">' +
      '<div class="card-head"><span class="name">' + NAMES[p] + '</span><span class="turn-badge">내 차례</span></div>' +
      '<div class="mid"><div class="score"><span id="score' + p + '">0</span><small>/ ' + TARGET + '</small></div>' +
      '<div class="deck" role="img" aria-label="마지막 투구의 핀 상태">' + rows + '</div></div>' +
      '<div class="meter"><i id="meter' + p + '"></i></div>' +
      '<div class="throws" id="throws' + p + '"></div></article>';
  }
  scoresEl.innerHTML = cardHTML(0) + cardHTML(1);

  /* ---------- game state ---------- */
  var scores = [0, 0], hist = [[], []], downSets = [[], []];
  var turn = 0, winner = -1;
  var state = 'idle'; // idle | rolling | won
  var time = 0, tt = 0;
  var pins = [], ball = { x: 0, z: 0, roll: 0, alpha: 1, visible: true, hit: false };
  var plan = null, banner = null, lastClick = null, hover = null, shake = 0, confetti = [];
  var staticCanvas = null;

  function resetPins(fadeIn) {
    pins = PIN_LAYOUT.map(function (d) {
      return { num: d.num, row: d.row, x0: d.x, z0: d.z, x: d.x, z: d.z, ang: 0, vx: 0, vz: 0, va: 0,
        state: 0, knockAt: null, appear: fadeIn ? 0 : 1, pit: 1, sweep: 1, wobAmp: 0, wobT: 0 };
    });
  }
  function resetBall(fadeIn) {
    ball.x = 0; ball.z = 0; ball.roll = 0; ball.hit = false; ball.visible = true; ball.alpha = fadeIn ? 0 : 1;
  }

  /* ---------- audio (synthesized, no files) ---------- */
  var AC = null, master = null, noiseBuf = null, muted = false, rollNodes = null;
  try { muted = localStorage.getItem('bowl-muted') === '1'; } catch (e) {}
  function syncSoundBtn() {
    soundBtn.textContent = muted ? '소리 꺼짐' : '소리 켜짐';
    soundBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
  }
  syncSoundBtn();
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(AC.destination);
    var len = Math.floor(AC.sampleRate * 1.5);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function burst(when, dur, type, freq, q, vol) {
    if (!AC) return;
    var s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = 0.8 + Math.random() * 0.4;
    var f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    var g = AC.createGain(); g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(when, Math.random() * 0.5); s.stop(when + dur + 0.03);
  }
  function tone(when, type, f0, f1, dur, vol) {
    if (!AC) return;
    var o = AC.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, when); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), when + dur);
    var g = AC.createGain(); g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    o.connect(g); g.connect(master); o.start(when); o.stop(when + dur + 0.03);
  }
  function sndPin(vol) {
    if (!AC) return;
    var t = AC.currentTime, base = 700 + Math.random() * 500;
    tone(t, 'triangle', base, base * 0.6, 0.09, 0.28 * vol);
    tone(t, 'square', base * 1.9, base * 1.2, 0.04, 0.05 * vol);
    burst(t, 0.07, 'highpass', 2800, 0.7, 0.35 * vol);
  }
  function sndBallHit() {
    if (!AC) return;
    var t = AC.currentTime;
    tone(t, 'sine', 170, 45, 0.38, 0.75);
    burst(t, 0.28, 'bandpass', 1800, 0.6, 0.7);
    burst(t, 0.5, 'lowpass', 500, 0.7, 0.35);
    sndPin(1);
  }
  function startRoll() {
    if (!AC) return;
    stopRoll(true);
    var s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 240;
    var g = AC.createGain(); var t = AC.currentTime;
    g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(0.45, t + 0.35);
    s.connect(f); f.connect(g); g.connect(master); s.start();
    rollNodes = { s: s, g: g };
  }
  function stopRoll(fast) {
    if (!rollNodes || !AC) return;
    var t = AC.currentTime, g = rollNodes.g, s = rollNodes.s;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(g.gain.value, 0.001), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (fast ? 0.03 : 0.12));
    s.stop(t + 0.18);
    rollNodes = null;
  }
  function sndWin() {
    if (!AC) return;
    var t = AC.currentTime, notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    notes.forEach(function (f, i) { tone(t + i * 0.12, 'triangle', f, f * 0.99, 0.3, 0.3); });
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f) { tone(t + 0.66, 'triangle', f, f * 0.99, 0.9, 0.2); });
  }
  soundBtn.addEventListener('click', function () {
    ensureAudio();
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.9;
    try { localStorage.setItem('bowl-muted', muted ? '1' : '0'); } catch (e) {}
    syncSoundBtn();
  });

  /* ---------- UI ---------- */
  function nameTag(p) { return '<b style="color:' + COLORS[p] + '">' + NAMES[p] + '</b>'; }
  function setStatus(html) { statusEl.innerHTML = html; }
  function idleStatus() { setStatus(nameTag(turn) + ' 차례 · 공의 정중앙을 클릭하세요'); }
  function updateUI() {
    for (var p = 0; p < 2; p++) {
      document.getElementById('score' + p).textContent = scores[p];
      document.getElementById('meter' + p).style.width = Math.min(100, scores[p] / TARGET * 100) + '%';
      document.getElementById('throws' + p).innerHTML = hist[p].length
        ? hist[p].map(function (n) { return '<span class="chip">' + n + '</span>'; }).join('')
        : '<span class="empty">아직 투구 없음</span>';
      var card = document.getElementById('card' + p);
      card.classList.toggle('active', turn === p && state !== 'won');
      var downs = downSets[p];
      var pinEls = card.querySelectorAll('.pin');
      for (var i = 0; i < pinEls.length; i++) {
        pinEls[i].classList.toggle('down', downs.indexOf(Number(pinEls[i].getAttribute('data-n'))) >= 0);
      }
    }
  }

  /* ---------- throwing ---------- */
  function throwBall(x, y) {
    var dx = x - CX, dy = y - BALL_CY0, d = Math.hypot(dx, dy);
    var acc = Math.max(0, 1 - d / (BALL_R * 2));
    var n = acc <= 0 ? 0 : Math.min(10, Math.floor(acc * 10 + 0.55));
    var side = dx > 0 ? 1 : dx < 0 ? -1 : (Math.random() < 0.5 ? -1 : 1);
    var gutter = n === 0;
    var endX = gutter ? side * 1.09 : clamp(side * d / W0, -0.85, 0.85);
    var order = pins.slice().sort(function (a, b) {
      return Math.abs(a.x0 - endX) - Math.abs(b.x0 - endX) || a.row - b.row || a.x0 - b.x0;
    });
    var knocked = order.slice(0, n);
    var tImpact = ROW_Z0 / VZ;
    knocked.forEach(function (p, i) { p.knockAt = tImpact + 0.02 + i * 0.035 + Math.random() * 0.03; });
    var tScore = gutter ? 1.9 : tImpact + 1.1;
    plan = { n: n, acc: acc, endX: endX, gutter: gutter, side: side, tImpact: tImpact, tScore: tScore, tReset: tScore + 1.5,
      scored: false, reset: false, nums: knocked.map(function (p) { return p.num; }) };
    lastClick = { x: x, y: y, acc: acc, t: time };
    banner = null; tt = 0; ball.hit = false; state = 'rolling';
    startRoll();
    setStatus(nameTag(turn) + ' · 공이 굴러갑니다…');
  }

  function knockPin(p) {
    p.state = 1;
    var away = (p.x0 - ball.x) >= 0 ? 1 : -1;
    if (Math.random() < 0.2) away = -away;
    p.vx = away * (0.35 + Math.random() * 0.6);
    p.vz = 0.12 + Math.random() * 0.34;
    var dir = Math.random() < 0.5 ? -1 : 1;
    p.va = dir * (3.2 + Math.random() * 2.2);
    sndPin(0.55 + Math.random() * 0.45);
  }

  function resolveThrow() {
    var p = turn, n = plan.n;
    scores[p] += n; hist[p].push(n); downSets[p] = plan.nums;
    banner = {
      t: time,
      text: n === 10 ? '스트라이크!' : n === 0 ? '거터!' : n + '핀',
      sub: n === 0 ? '0점' : '+' + n + '점',
      color: n === 10 ? '#f5b83c' : n === 0 ? '#a3c4c2' : '#f7f0dc'
    };
    var msg = n === 10 ? '스트라이크! 10개를 모두 쓰러뜨렸습니다 (+10점)'
      : n === 0 ? '거터! 0점' : n + '개를 쓰러뜨렸습니다 (+' + n + '점)';
    if (scores[p] >= TARGET) {
      state = 'won'; winner = p;
      updateUI();
      setStatus(nameTag(p) + ' · ' + msg);
      spawnConfetti(reduce ? 40 : 140, true);
      setTimeout(showWin, 900);
      return;
    }
    turn = 1 - turn;
    updateUI();
    setStatus(nameTag(p) + ' · ' + msg);
  }

  function finishTurn() {
    resetPins(true);
    resetBall(true);
    plan = null;
    state = 'idle';
    idleStatus();
  }

  function showWin() {
    if (state !== 'won') return;
    document.getElementById('winTitle').textContent = NAMES[winner] + ' 승리!';
    document.getElementById('winSub').textContent = '축하합니다! ' + scores[winner] + '점으로 먼저 ' + TARGET + '점을 달성했습니다.';
    document.getElementById('winFinal').textContent = '최종 점수  ' + scores[0] + ' : ' + scores[1];
    overlay.hidden = false;
    sndWin();
    setTimeout(function () { var b = document.getElementById('again'); if (b) b.focus(); }, 50);
  }

  function restart() {
    overlay.hidden = true;
    scores = [0, 0]; hist = [[], []]; downSets = [[], []];
    turn = 0; winner = -1; confetti = []; banner = null; lastClick = null; plan = null;
    resetPins(true); resetBall(true);
    state = 'idle';
    updateUI(); idleStatus();
  }
  document.getElementById('again').addEventListener('click', restart);

  /* ---------- input ---------- */
  function toCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  canvas.addEventListener('click', function (e) {
    ensureAudio();
    if (state !== 'idle') return;
    var p = toCanvas(e);
    throwBall(p.x, p.y);
  });
  canvas.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    ensureAudio();
    if (state !== 'idle') return;
    var a = Math.random() * Math.PI * 2, r = Math.random() * BALL_R * 1.3;
    throwBall(CX + Math.cos(a) * r, BALL_CY0 + Math.sin(a) * r);
  });

  /* ---------- confetti ---------- */
  var CONF_COLORS = ['#f5b83c', '#62d3bf', '#d6181f', '#f7f0dc'];
  function spawnConfetti(count, burstAll) {
    for (var i = 0; i < count; i++) {
      confetti.push({
        x: Math.random() * W, y: burstAll ? -Math.random() * 260 - 10 : -10,
        vx: (Math.random() - 0.5) * 80, vy: 130 + Math.random() * 160,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 8,
        size: 6 + Math.random() * 5, color: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0]
      });
    }
  }

  /* ---------- update ---------- */
  function updatePins(dt) {
    for (var i = 0; i < pins.length; i++) {
      var p = pins[i];
      if (p.appear < 1) p.appear = Math.min(1, p.appear + dt / 0.4);
      if (p.state === 1) {
        p.x += p.vx * dt; p.z += p.vz * dt; p.ang += p.va * dt;
        var k1 = Math.exp(-2.4 * dt), k2 = Math.exp(-2.1 * dt);
        p.vx *= k1; p.vz *= k2; p.va *= k1;
        if (p.z > 1.07) p.pit = Math.max(0, 1 - (p.z - 1.07) / 0.08);
      } else if (p.wobAmp > 0) {
        p.wobT += dt;
        p.ang = p.wobAmp * Math.sin(p.wobT * 26) * Math.exp(-p.wobT * 4.5);
        if (p.wobT > 1.4) { p.wobAmp = 0; p.ang = 0; }
      }
    }
  }

  function updateBall(dt) {
    ball.z = VZ * tt;
    if (plan.gutter) {
      var g = Math.min(1, ball.z / 0.45);
      ball.x = plan.endX * (g * g * (3 - 2 * g));
    } else {
      ball.x = plan.endX * Math.pow(Math.min(1, ball.z / ROW_Z0), 1.3);
    }
    ball.roll += dt * 9;
    if (ball.z > 1.02) ball.alpha = clamp((1.12 - ball.z) / 0.1, 0, 1);
    if (ball.z > 1.12) { ball.visible = false; stopRoll(false); }
    if (!plan.gutter && !ball.hit && ball.z >= ROW_Z0) {
      ball.hit = true;
      stopRoll(true);
      sndBallHit();
      shake = 0.3;
      for (var i = 0; i < pins.length; i++) {
        var p = pins[i];
        if (p.knockAt === null) {
          p.wobAmp = 0.12 * Math.exp(-Math.abs(p.x0 - ball.x) * 2.5);
          p.wobT = 0;
        }
      }
    }
  }

  function update(dt) {
    time += dt;
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (ball.alpha < 1 && ball.visible && state !== 'rolling') ball.alpha = Math.min(1, ball.alpha + dt / 0.3);
    if (state === 'rolling' && plan) {
      tt += dt;
      updateBall(dt);
      for (var i = 0; i < pins.length; i++) {
        var p = pins[i];
        if (p.knockAt !== null && p.state === 0 && tt >= p.knockAt) knockPin(p);
      }
      var fade = clamp((plan.tReset - tt) / 0.4, 0, 1);
      for (var j = 0; j < pins.length; j++) pins[j].sweep = fade;
      if (!plan.scored && tt >= plan.tScore) { plan.scored = true; resolveThrow(); }
      if (state === 'rolling' && !plan.reset && tt >= plan.tReset) { plan.reset = true; finishTurn(); }
    }
    updatePins(dt);
    if (confetti.length) {
      for (var c = confetti.length - 1; c >= 0; c--) {
        var q = confetti[c];
        q.y += q.vy * dt; q.x += (q.vx + Math.sin(time * 3 + c) * 30) * dt; q.rot += q.vr * dt;
        if (q.y > H + 20) confetti.splice(c, 1);
      }
    }
    if (state === 'won' && !overlay.hidden && confetti.length < (reduce ? 25 : 90)) spawnConfetti(reduce ? 1 : 2, false);
  }

  /* ---------- drawing ---------- */
  var PROF = [[0, 0.085], [0.04, 0.12], [0.12, 0.17], [0.26, 0.2], [0.4, 0.185], [0.52, 0.13], [0.62, 0.075],
    [0.7, 0.062], [0.78, 0.07], [0.86, 0.095], [0.93, 0.09], [0.98, 0.05], [1, 0]];
  function pinPath(h) {
    var pts = [], i;
    for (i = 0; i < PROF.length; i++) pts.push([PROF[i][1] * h, -PROF[i][0] * h]);
    for (i = PROF.length - 1; i >= 0; i--) pts.push([-PROF[i][1] * h, -PROF[i][0] * h]);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length - 1; i++) {
      var mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    ctx.closePath();
  }
  function drawPin(p) {
    var a = p.appear * p.pit * p.sweep;
    if (a <= 0.01) return;
    var s = sc(p.z), px = sx(p.x, p.z), py = sy(p.z), h = 0.74 * W0 * s;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(px + h * 0.04, py, h * 0.2, h * 0.06, 0, 0, Math.PI * 2); ctx.fill();
    ctx.translate(px, py);
    ctx.rotate(p.ang);
    pinPath(h);
    var g = ctx.createLinearGradient(-h * 0.2, 0, h * 0.2, 0);
    g.addColorStop(0, '#fffdf6'); g.addColorStop(0.55, '#f1eadb'); g.addColorStop(1, '#bdb5a2');
    ctx.fillStyle = g; ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = RED;
    ctx.fillRect(-h * 0.3, -h * 0.675, h * 0.6, h * 0.055);
    ctx.fillRect(-h * 0.3, -h * 0.755, h * 0.6, h * 0.04);
    ctx.restore();
    pinPath(h);
    ctx.lineWidth = Math.max(0.8, h * 0.02);
    ctx.strokeStyle = 'rgba(40,30,20,0.55)';
    ctx.stroke();
    ctx.restore();
  }

  var HOLES = [[0, -0.45], [-0.15, -0.22], [0.15, -0.22]];
  function drawBall() {
    var s = sc(ball.z), r = BALL_R * s, px = sx(ball.x, ball.z), py = bcy(ball.z);
    ctx.save();
    ctx.globalAlpha = ball.alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(px + r * 0.12, py + r * 0.92, r * 0.85, r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
    var g = ctx.createRadialGradient(px - r * 0.38, py - r * 0.42, r * 0.1, px, py, r);
    g.addColorStop(0, '#ff7b72'); g.addColorStop(0.35, RED); g.addColorStop(1, '#6e070c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
    var th = ball.roll;
    for (var i = 0; i < HOLES.length; i++) {
      var h = HOLES[i];
      var zc = Math.sqrt(Math.max(0, 1 - h[0] * h[0] - h[1] * h[1]));
      var y2 = h[1] * Math.cos(th) - zc * Math.sin(th);
      var z2 = h[1] * Math.sin(th) + zc * Math.cos(th);
      if (z2 > 0.1) {
        ctx.fillStyle = '#2a0306';
        ctx.beginPath(); ctx.ellipse(px + h[0] * r, py + y2 * r, r * 0.11, r * 0.11 * z2, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(px - r * 0.36, py - r * 0.45, r * 0.16, r * 0.09, -0.7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  var BODY = '"Noto Sans KR","Malgun Gothic",sans-serif';
  var DISP = '"Black Han Sans","Noto Sans KR","Malgun Gothic",sans-serif';
  function outlined(text, x, y, fill) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(6,24,28,0.85)';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }

  function drawHUD() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var idle = state === 'idle' && ball.visible;
    if (idle) {
      ctx.font = '700 15px ' + BODY;
      outlined('공의 정중앙을 클릭하세요', CX, 650, '#f7f0dc');
    }
    if (lastClick) {
      var age = time - lastClick.t;
      if (age < 1.5) {
        if (age < 0.6) {
          ctx.save();
          ctx.globalAlpha = 1 - age / 0.6;
          ctx.strokeStyle = '#f7f0dc'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(lastClick.x, lastClick.y, 6 + age * 55, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }
      }
    }
    if (banner) {
      var t = time - banner.t;
      if (t > 1.8) { banner = null; }
      else {
        var scale = 1 + 0.35 * Math.max(0, 1 - t * 4);
        var al = t > 1.4 ? 1 - (t - 1.4) / 0.4 : 1;
        ctx.save();
        ctx.globalAlpha = al;
        ctx.translate(CX, 360); ctx.scale(scale, scale);
        ctx.font = '64px ' + DISP;
        outlined(banner.text, 0, 0, banner.color);
        ctx.font = '700 20px ' + BODY;
        outlined(banner.sub, 0, 46, '#f7f0dc');
        ctx.restore();
      }
    }
    for (var i = 0; i < confetti.length; i++) {
      var q = confetti[i];
      ctx.save();
      ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.fillStyle = q.color;
      ctx.fillRect(-q.size / 2, -q.size / 4, q.size, q.size / 2);
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0 && !reduce) ctx.translate((Math.random() - 0.5) * shake * 12, (Math.random() - 0.5) * shake * 12);
    if (staticCanvas) ctx.drawImage(staticCanvas, 0, 0, W, H);
    var items = pins.map(function (p) { return { z: p.z, f: function () { drawPin(p); } }; });
    if (ball.visible && ball.alpha > 0.01) items.push({ z: ball.z, f: drawBall });
    items.sort(function (a, b) { return b.z - a.z; });
    for (var i = 0; i < items.length; i++) items[i].f();
    ctx.restore();
    drawHUD();
  }

  /* ---------- static lane layer ---------- */
  function buildStatic() {
    var off = document.createElement('canvas');
    off.width = W * DPR; off.height = H * DPR;
    var c = off.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    function P(x, z) { return [sx(x, z), sy(z)]; }
    function quad(x0, x1, z0, z1, fill, stroke) {
      var a = P(x0, z0), b = P(x1, z0), d = P(x1, z1), e = P(x0, z1);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(d[0], d[1]); c.lineTo(e[0], e[1]); c.closePath();
      c.fillStyle = fill; c.fill();
      if (stroke) { c.strokeStyle = fill; c.lineWidth = 0.7; c.stroke(); }
    }
    var ZN = -0.2, ZE = 1.0, ZP = 1.36, i, k;

    var bg = c.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a2124'); bg.addColorStop(0.5, '#0f2e32'); bg.addColorStop(1, '#134148');
    c.fillStyle = bg; c.fillRect(0, 0, W, H);

    // pit
    quad(-1.17, 1.17, ZE, ZP, '#06161a', true);
    var pg = c.createLinearGradient(0, sy(ZP), 0, sy(ZE));
    pg.addColorStop(0, 'rgba(0,0,0,0.65)'); pg.addColorStop(1, 'rgba(0,0,0,0)');
    var pa = P(-1.17, ZE), pb = P(1.17, ZE), pc = P(1.17, ZP), pd = P(-1.17, ZP);
    c.beginPath(); c.moveTo(pa[0], pa[1]); c.lineTo(pb[0], pb[1]); c.lineTo(pc[0], pc[1]); c.lineTo(pd[0], pd[1]); c.closePath();
    c.fillStyle = pg; c.fill();

    // side rails
    quad(1.17, 1.34, ZN, ZP, '#1d5159', true);
    quad(-1.34, -1.17, ZN, ZP, '#1d5159', true);
    quad(1.34, 1.9, ZN, ZP, '#12373d', true);
    quad(-1.9, -1.34, ZN, ZP, '#12373d', true);

    // gutters
    quad(1.0, 1.04, ZN, ZE, '#4a5f61', true);
    quad(1.04, 1.17, ZN, ZE, '#1a292c', true);
    quad(-1.04, -1.0, ZN, ZE, '#4a5f61', true);
    quad(-1.17, -1.04, ZN, ZE, '#1a292c', true);

    // lane boards (39)
    var maple = ['#dba95f', '#d6a257', '#e0b068', '#d9a55c', '#e3b46f', '#d29c52', '#deae64'];
    var approach = ['#e8c283', '#e4bb7a', '#ecc88d', '#e6bf80', '#eac58a'];
    for (k = 0; k < 39; k++) {
      var x0 = -1 + 2 * k / 39, x1 = -1 + 2 * (k + 1) / 39;
      quad(x0, x1, 0.08, ZE, maple[(k * 37) % maple.length], true);
      quad(x0, x1, ZN, 0.08, approach[(k * 17) % approach.length], true);
    }
    c.save();
    var lp = [P(-1, ZN), P(1, ZN), P(1, ZE), P(-1, ZE)];
    c.beginPath(); c.moveTo(lp[0][0], lp[0][1]); c.lineTo(lp[1][0], lp[1][1]); c.lineTo(lp[2][0], lp[2][1]); c.lineTo(lp[3][0], lp[3][1]); c.closePath();
    c.clip();
    c.strokeStyle = 'rgba(90,50,12,0.16)'; c.lineWidth = 0.6;
    for (k = 0; k <= 39; k++) {
      var xk = -1 + 2 * k / 39, a0 = P(xk, ZN), a1 = P(xk, ZE);
      c.beginPath(); c.moveTo(a0[0], a0[1]); c.lineTo(a1[0], a1[1]); c.stroke();
    }
    var sh = c.createLinearGradient(0, sy(ZE), 0, sy(0));
    sh.addColorStop(0, 'rgba(20,10,0,0.28)'); sh.addColorStop(0.5, 'rgba(255,240,210,0.04)'); sh.addColorStop(1, 'rgba(255,245,225,0.16)');
    c.fillStyle = sh; c.fillRect(0, 0, W, H);
    c.restore();

    // foul line
    quad(-1, 1, 0.075, 0.09, '#3a2412', false);

    // approach dots
    c.fillStyle = 'rgba(70,40,12,0.7)';
    [-0.6, -0.3, 0.3, 0.6].forEach(function (x) {
      var p = P(x, 0.035), r = 4.5 * sc(0.035);
      c.beginPath(); c.ellipse(p[0], p[1], r, r * 0.6, 0, 0, Math.PI * 2); c.fill();
    });

    // range-finder arrows
    c.fillStyle = '#7a4a1e';
    [-0.77, -0.51, -0.26, 0, 0.26, 0.51, 0.77].forEach(function (x, idx) {
      var zc = 0.28 + 0.1 * (1 - Math.abs(idx - 3) / 3);
      var apex = P(x, zc + 0.04), l = P(x - 0.035, zc), r = P(x + 0.035, zc);
      c.beginPath(); c.moveTo(apex[0], apex[1]); c.lineTo(r[0], r[1]); c.lineTo(l[0], l[1]); c.closePath(); c.fill();
    });

    // pin spots
    c.fillStyle = 'rgba(120,76,28,0.55)';
    PIN_LAYOUT.forEach(function (d) {
      var p = P(d.x, d.z), r = 6.5 * sc(d.z) / sc(0.9);
      c.beginPath(); c.ellipse(p[0], p[1], r, r * 0.4, 0, 0, Math.PI * 2); c.fill();
    });

    // masking unit
    var wall = c.createLinearGradient(0, 0, 0, sy(ZP));
    wall.addColorStop(0, '#05161a'); wall.addColorStop(1, '#0b2327');
    c.fillStyle = wall; c.fillRect(0, 0, W, sy(ZP) + 1);
    c.fillStyle = '#0f3036'; c.fillRect(0, sy(ZP) - 2, W, 3);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '30px "Black Han Sans","Noto Sans KR",sans-serif';
    c.fillStyle = '#f5b83c';
    c.fillText('LANE 7', CX, 44);
    c.font = '500 11px "Noto Sans KR",sans-serif';
    c.fillStyle = 'rgba(163,196,194,0.8)';
    c.fillText('PIN DECK  ·  60 FT', CX, 70);

    // vignette
    var vg = c.createRadialGradient(W / 2, H * 0.55, H * 0.3, W / 2, H * 0.55, H * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.38)');
    c.fillStyle = vg; c.fillRect(0, 0, W, H);

    return off;
  }

  /* ---------- boot ---------- */
  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function start(data) {
    staticCanvas = buildStatic();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { staticCanvas = buildStatic(); });
    }
    resetPins(false);
    resetBall(false);
    if (data && Array.isArray(data.scores) && Array.isArray(data.hist) && !data.over) {
      scores = data.scores.slice(0, 2);
      hist = data.hist.map(function (h) { return h.slice(); });
      turn = data.turn === 1 ? 1 : 0;
    }
    updateUI();
    idleStatus();
    requestAnimationFrame(frame);
  }

  try {
    var hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) {
      hot.snapshot(function () { return { scores: scores, hist: hist, turn: turn, over: state === 'won' }; });
    }
  } catch (e) {}
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

</body></html>
